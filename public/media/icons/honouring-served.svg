<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Honouring those who served">
  <title>Honouring those who served</title>
  <!-- Classical commemorative bust on pedestal -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="32" cy="16.5" r="8" stroke="#6D2227" stroke-width="2.15"/>
    <!-- shoulders / torso -->
    <path d="M18 38 C18 28.5 23.5 24 32 24 C40.5 24 46 28.5 46 38" stroke="#6D2227" stroke-width="2.15"/>
    <!-- collar line (gold) -->
    <path d="M24 33.5 C27 35.5 37 35.5 40 33.5" stroke="#AF8B58" stroke-width="1.6"/>
    <!-- pedestal shelf -->
    <path d="M16 38 H48" stroke="#AF8B58" stroke-width="2"/>
    <path d="M20 38 L18 44 H46 L44 38" stroke="#AF8B58" stroke-width="1.85"/>
    <!-- plinth -->
    <rect x="24" y="44" width="16" height="7" rx="0.75" stroke="#6D2227" stroke-width="1.9"/>
    <path d="M18 54 H46" stroke="#AF8B58" stroke-width="1.85"/>
    <path d="M21 51 H43" stroke="#AF8B58" stroke-width="1.5"/>
  </g>
</svg>
